name: update-manifests

on:
  schedule:
    # 04:00 UTC daily.
    - cron: "0 4 * * *"
  workflow_dispatch:

# Prevent overlapping runs from racing each other, but don't cancel an
# in-flight refresh just because the next cron tick arrived.
concurrency:
  group: update-manifests
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Refresh manifests
        env:
          # Honoured by scripts/update-manifests.sh to raise the
          # GitHub API rate limit from 60/hr (anon) to 1000/hr.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix run --no-update-lock-file .#update-manifests

      - name: Verify the flake still evaluates
        run: nix flake check --all-systems --no-update-lock-file

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if git diff --quiet manifests/; then
            echo "manifests already up to date"
            exit 0
          fi
          summary="$(git diff --stat manifests/)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifests/
          git commit -m "$(printf 'chore(manifests): nightly refresh\n\n%s\n' "$summary")"
          git push origin main
